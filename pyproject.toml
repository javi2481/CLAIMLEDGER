[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claimledger"
version = "0.0.0"
description = "Verified financial claims ledger"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]
docling = [
    "docling==2.130.0",
    "docling-graph==1.9.1",
]
retrieval = [
    "llama-index-readers-docling==0.5.0",
    "llama-index-node-parser-docling==0.5.0",
]
http = [
    "starlette==1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
