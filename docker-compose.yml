services:
  claimledger:
    build: .
    command:
      ["uvicorn", "claimledger.openwebui.app:build_host", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CLAIMLEDGER_ARTIFACT_HASH: ${CLAIMLEDGER_ARTIFACT_HASH:-7b7b624ade1011f9fd75931968312ef5c0fa19fe6061bb2cc5eb1491ffaa364f}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - ./artifacts/docling:/usr/local/lib/python3.11/artifacts/docling:ro
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.4-slim
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_BASE_URL: http://claimledger:8000/v1
      OPENAI_API_KEYS: claimledger
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
    depends_on:
      - claimledger
