services:
  docling-serve:
    image: quay.io/docling-project/docling-serve-cpu:v1.35.0
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_ENABLE_UI: "false"
      # Sync /v1/convert/file waits this long before HTTP 504 (default 120s).
      DOCLING_SERVE_MAX_SYNC_WAIT: "7200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/version')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  claimledger:
    build: .
    command:
      ["uvicorn", "claimledger.openwebui.app:build_host", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CLAIMLEDGER_ARTIFACT_HASH: ${CLAIMLEDGER_ARTIFACT_HASH:-7b7b624ade1011f9fd75931968312ef5c0fa19fe6061bb2cc5eb1491ffaa364f}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DOCLING_SERVE_URL: ${DOCLING_SERVE_URL:-http://docling-serve:5001}
    volumes:
      - ./artifacts/docling:/app/artifacts/docling:ro
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.4-slim
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_BASE_URL: http://claimledger:8000/v1
      OPENAI_API_KEYS: claimledger
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
    depends_on:
      - claimledger
