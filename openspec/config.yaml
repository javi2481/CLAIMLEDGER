schema: spec-driven
project: claimledger
persistence: hybrid
strict_tdd: true

context: |
  CLAIMLEDGER: verified financial claims ledger. Architecture CLOSED (docs/documento-rector.md).
  Phases 0–9 and 11–13 are implemented. Phase 10 (VLM second reader) is deferred until a GPU exists. Active change: none. Archived reply-without-retrieval (reply, measure, and card do not import DoclingReader; rows from verified evidence; image .[http,deepseek]; search ImportError returns empty hits). Archived runtime-json-book (pure-JSON extract_recipe body $ref walk + data.grid only; ingest=[httpx]; book/query Docling-free). Archived max-docling-parse (Docling Serve v1.35.0 compiler; convert via POST /v1/convert/file ZIP; query independent of serve). Archived llm-tools-host (agent/ verify+search; host-gated DeepSeek prose). Archived ground-ledger (product book from quarterly EEFF; hash check on load).
  Status for humans: docs/plan-implementacion.md. Phase 11 writes graph.cypher via CypherExporter and does not start Neo4j. Phase 12 is a Mermaid xychart of a verified series. Phase 13 is a deterministic four-quarter plan that calls query. Product paths use recorded_book(); kernel gold stays Ledger.seed(). Completions may append host-gated agent prose or the controlled abstention template after the card.
  Native-stack audit is on demand at openspec/changes/auditoria-stack-nativo/. It is not a wave phase.
  Python >=3.11 + pytest. Pins: docling==2.130.0, docling-graph==1.9.1, llama-index docling reader and node parser 0.5.0, starlette==1.0.0, Open WebUI v0.11.4-slim.
  Kernel tests stay free of docling, network, PDF, and Docker. Gold numbers stay frozen. No LLM stage for identity. No agent may skip the kernel.
  Retrieval uses DoclingReader(export_type="json"). Never MinerU. Architecture Gate before new components.
  User-facing docs: Spanish. OpenSpec/SDD artifacts: English.
  Strict TDD. Test command: python -m pytest.

testing:
  runner:
    detected: true
    planned: pytest
    command: python -m pytest
  layers:
    unit: pytest; in-memory kernel; no network, no PDF, no docling import in kernel tests
    integration: ingest, graph, retrieval, http, and host tests run in the same pytest command
    e2e: no separate browser runner
  coverage:
    detected: false
    command: null
  quality:
    linter: not_detected
    type_checker: not_detected
    formatter: not_detected
  constraints:
    - Kernel tests MUST NOT import docling
    - Gold identity_v1 (45) + identity_v2 (26) are regression contracts; numeric expected values are frozen
    - Kernel tests keep the Fase 0 boundary: no Docker, Graph, LlamaIndex, Open WebUI, VLM, or HTTP API

rules:
  proposal:
    - Architecture is CLOSED. Do not invent new product architecture.
    - Canonical source: docs/documento-rector.md. Filter: docs/north-star.md. Fase 0 contract: docs/fase-0.md.
    - Include a rollback plan for risky changes.
    - Native stack first. Do not propose a script for a job Docling, DocLang, docling-graph, LlamaIndex, Starlette, or Open WebUI already does in the pinned version. Custom code only for a named gap.
    - User-facing docs stay Spanish; this change artifact is English.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Do not relax gold numeric expected values.
    - Kernel specs MUST forbid docling imports in tests.
  design:
    - Do not invent layers, agents, or stack substitutions.
    - Architecture Gate: a new component is allowed only if it solves a concrete problem the current design cannot.
    - Native stack first. Prefer the pinned library call. Custom code only when that library cannot do the job, and the design names the gap.
    - Sequence diagrams only for flows already in the rector.
    - Document decisions with rationale; never MinerU; never Markdown as retrieval SoT.
  tasks:
    - Group by phase; use hierarchical numbering.
    - Keep tasks completable in one session.
    - Forecast the 400-line PR review budget before apply.
    - Fase 0 task order follows docs/fase-0.md commit order.
  apply:
    guidelines:
      - Follow existing docs/contracts; do not rewrite the rector.
      - RED-GREEN-REFACTOR. Write a failing test before production code.
      - Do not reopen the kernel contract or relax gold. New product code names the gap the pinned stack cannot fill.
    tdd: true
    test_command: python -m pytest
  verify:
    test_command: python -m pytest
    build_command: ""
    coverage_threshold: 0
    extra:
      - Test command is python -m pytest
      - Kernel test suite MUST stay import-docling-free
  archive:
    - Warn before merging destructive deltas
    - Keep rector and north-star as user-facing Spanish sources of truth
